name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  main:
    runs-on: macos-latest
    steps:
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.0"
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-Journey-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-Journey
      - name: Build
        run: xcodebuild -scheme Journey -destination 'generic/platform=iOS Simulator'
